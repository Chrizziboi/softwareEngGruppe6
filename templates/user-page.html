<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat&family=Ubuntu&:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../static/styles/images/favicon_Tourify.png">
    <meta charset="UTF-8">
    <title>Tourify</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/style.css') }}">
</head>
<body>
    <div class="flex-container">
        <div id="sideLeft" class="center-align">
            <p></p>
        </div>
        <div id="middle">
            <div  id="titleWrapper">
                <h2 id="title" class="center-align">
                    <a href="{{ url_for('index')}}">
                        <img src="../static/styles/images/favicon_Tourify-2.png" style="max-width: 300px; margin-bottom: -20px;">
                        <!---Tourify--->
                    </a>
                </h2>
            </div>

            <div id="mainText"> <!--Eksempeltekst-->
                <form action="/search-results" method="get">
                    <label>
                        <input type="text" name="query" placeholder="Din drømmereise" id="search-bar">
                        <button type="submit" id="search-button">Søk</button>
                    </label>
                </form>

            </div>
        </div>
        <div id="sideRight">
            <div id="buttonWrapper">
                <p>Logget inn som</p>
                <div class="dropdown">
                    <button class="dropbtn">Bruker</button>
                    <div class="dropdown-content">
                        <a href="" style="color: grey">Hjemside</a>
                        <a href="{{ url_for('useredit') }}">Rediger profil</a>
                        <a href="{{ url_for('usertrips') }}">Mine turer</a>
                        <a href="{{ url_for('index') }}">
                            <button class="loginButton">
                                Logg ut
                            </button>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="center-align" id="footer">
        <footer>
            <p>BLFMP AS &copy; 2023</p>
        </footer>
    </div>
</body>
</html>
